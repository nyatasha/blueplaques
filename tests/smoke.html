<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>London Uncovered — smoke test</title>
<style>
  body { font: 13px/1.6 ui-monospace, Menlo, monospace; margin: 20px; background: #14202B; color: #DDE3E9; }
  h1 { font-size: 15px; margin-bottom: 12px; }
  .pass { color: #6FCF97; } .fail { color: #FF8A80; } .group { color: #7FB3E8; margin-top: 10px; }
  iframe { position: fixed; left: -9999px; top: 0; border: 0; }
  #summary { font-size: 16px; font-weight: 700; margin-top: 16px; }
</style>
</head>
<body>
<h1>London Uncovered — browser smoke test</h1>
<pre id="out">running…</pre>
<div id="summary"></div>
<iframe id="app" width="390" height="844"></iframe>

<script type="module">
/**
 * Drives the real application inside an iframe and asserts on what a user
 * would actually see. Top-level await keeps the document's load event pending
 * until every check has run, so `chrome --dump-dom` captures the results.
 */

const lines = [];
let passed = 0, failed = 0;

/** Written after every check so a stalled run still shows how far it got. */
function flush() { document.getElementById('out').innerHTML = lines.join('\n'); }

const group = t => { lines.push(`\n<span class="group">${t}</span>`); flush(); };
function check(name, ok, detail = '') {
  if (ok) { passed++; lines.push(`<span class="pass">  ok  </span>${name}`); }
  else { failed++; lines.push(`<span class="fail">  FAIL</span> ${name}${detail ? ` — ${detail}` : ''}`); }
  flush();
}
const eq = (name, a, b) => check(name, a === b, `expected ${JSON.stringify(b)}, got ${JSON.stringify(a)}`);

const sleep = ms => new Promise(r => setTimeout(r, ms));
async function until(fn, { timeout = 15000, step = 100 } = {}) {
  const deadline = Date.now() + timeout;
  while (Date.now() < deadline) {
    try { const v = fn(); if (v) return v; } catch { /* not ready */ }
    await sleep(step);
  }
  return null;
}

window.addEventListener('error', e => { lines.push(`<span class="fail">  ERROR</span> ${e.message}`); flush(); });
window.addEventListener('unhandledrejection', e => { lines.push(`<span class="fail">  REJECT</span> ${e.reason}`); flush(); });

group('loading app frame');
// The frame and this page share an origin, so clearing storage here gives the
// app a clean first-visit state before it boots.
try { localStorage.removeItem('londonUncovered:v0'); } catch { /* ignore */ }

const frame = document.getElementById('app');
frame.src = '/index.html';

// Wait for the *real* document. An iframe starts life on about:blank, which is
// already `complete`, so a naive load-event wait captures the wrong Document.
const ready = await until(
  () => frame.contentWindow?.__lu && frame.contentDocument?.getElementById('boot'),
  { timeout: 40000 });
check('app frame booted', !!ready);

const win = frame.contentWindow;
const doc = frame.contentDocument;

const q = sel => doc.querySelector(sel);
const qa = sel => Array.from(doc.querySelectorAll(sel));

try {
/* ── Boot ───────────────────────────────────────────────────────────────── */
group('boot');
const lu = win.__lu;
check('app exposes its dev handle (boot completed)', !!lu);

if (lu) {
  await until(() => q('#boot').hidden);
  eq('boot overlay is dismissed', q('#boot').hidden, true);
  check('no error card rendered', !doc.body.textContent.includes("Couldn't load"));

  const total = lu.state.plaques.length;
  check('dataset loaded', total > 900, `${total} plaques`);
  eq('counter shows zero of the full dataset', q('#counter-value').textContent.replace(/\s+/g, ' ').trim(), `0 / ${total.toLocaleString('en-GB')}`);
  check('map count pill populated', /discoveries/.test(q('#map-count').textContent));
  eq('total-count in the crawlable About copy', q('#total-count').textContent, total.toLocaleString('en-GB'));

  /* ── Map ──────────────────────────────────────────────────────────────── */
  group('map');
  await until(() => qa('.leaflet-marker-icon').length > 10);
  check('markers or clusters rendered', qa('.leaflet-marker-icon').length > 10, `${qa('.leaflet-marker-icon').length} icons`);
  check('tiles requested', qa('.leaflet-tile').length > 0, `${qa('.leaflet-tile').length} tiles`);
  check('tile source needs no API key', !qa('.leaflet-tile').some(t => /cartocdn/.test(t.src)));
  eq('category chips rendered', qa('#chips .chip').length, 10);
  eq('first chip is All and is active', q('#chips .chip').getAttribute('aria-pressed'), 'true');

  /* ── Layout ───────────────────────────────────────────────────────────── */
  group('layout @390px');
  eq('no horizontal document overflow', doc.documentElement.scrollWidth <= 390, true);
  const bar = q('#brandbar').getBoundingClientRect();
  const about = q('#about-open').getBoundingClientRect();
  const counter = q('#counter').getBoundingClientRect();
  check('brand bar fits the viewport', bar.right <= 390.5, `right=${bar.right.toFixed(1)}`);
  check('counter is fully visible', counter.right <= 390.5 && counter.left >= 0, `left=${counter.left.toFixed(1)} right=${counter.right.toFixed(1)}`);
  check('about button is fully visible', about.right <= 390.5 && about.width > 0, `right=${about.right.toFixed(1)}`);
  const tabs = qa('.tab');
  eq('three primary tabs', tabs.length, 3);
  check('every tab is at least 44px tall', tabs.every(t => t.getBoundingClientRect().height >= 44),
        tabs.map(t => t.getBoundingClientRect().height.toFixed(0)).join('/'));
  const cta = q('#find-next').getBoundingClientRect();
  check('primary CTA is within the viewport', cta.left >= 0 && cta.right <= 390.5, `${cta.left.toFixed(0)}–${cta.right.toFixed(0)}`);
  check('primary CTA sits above the tab bar', cta.bottom <= q('#tabbar').getBoundingClientRect().top + 1);
  // Measure the area a finger can actually hit, which may be widened by a
  // pseudo-element, rather than the painted box.
  const hitsAt = (el, x, y) => { const hit = doc.elementFromPoint(x, y); return !!hit && (hit === el || el.contains(hit) || hit.closest('button') === el); };
  const targetOk = (sel) => {
    const el = q(sel);
    const r = el.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    return hitsAt(el, cx, cy) && hitsAt(el, cx, cy - 21) && hitsAt(el, cx, cy + 21)
        && hitsAt(el, cx - 21, cy) && hitsAt(el, cx + 21, cy);
  };
  const touchTargets = ['#locate', '#filters-open', '#find-next', '#counter', '#about-open'];
  const failing = touchTargets.filter(sel => !targetOk(sel));
  check('key controls offer a 44px touch target', failing.length === 0, `too small: ${failing.join(', ')}`);

  /* ── Search ───────────────────────────────────────────────────────────── */
  group('search');
  const input = q('#search');
  input.focus();
  input.value = 'woolf';
  input.dispatchEvent(new win.Event('input', { bubbles: true }));
  await until(() => !q('#suggest').hidden);
  check('suggestions open', !q('#suggest').hidden);
  check('a person suggestion is offered', qa('#suggest .sg-item[data-kind="plaque"]').length > 0);
  check('the query filters the map count', /of/.test(q('#map-count').textContent), q('#map-count').textContent);
  const first = q('#suggest .sg-item');
  check('suggestion labels the match', /Woolf/i.test(first.textContent), first.textContent.trim());
  first.click();
  await until(() => q('#sheet-plaque').classList.contains('open'));
  check('choosing a suggestion opens the plaque sheet', q('#sheet-plaque').classList.contains('open'));
  check('sheet shows the chosen person', /Woolf/i.test(q('#plaque-body').textContent));
  check('search cleared after selection', input.value === '');

  /* ── Collect ──────────────────────────────────────────────────────────── */
  group('collect');
  check('collect action offered', !!q('#plaque-foot [data-act="collect"]'));
  q('#plaque-foot [data-act="collect"]').click();
  await until(() => lu.progress().count === 1);
  eq('one discovery recorded', lu.progress().count, 1);
  eq('counter updated', q('#counter-value').textContent.replace(/\s+/g, ' ').trim().startsWith('1 /'), true);
  check('xp awarded', lu.progress().xp > 0, `${lu.progress().xp} XP`);
  check('unverified without location', lu.progress().verified === 0);
  await until(() => qa('#toasts .toast').length > 0);
  check('a discovery toast appears', qa('#toasts .toast').length > 0);
  check('found state shown in the sheet', /Found/.test(q('#plaque-foot').textContent));
  await until(() => qa('.pin-collected').length > 0, { timeout: 3000 });
  check('marker switches to the collected state', qa('.pin-collected').length > 0);
  check('progress persisted to localStorage',
        JSON.parse(win.localStorage.getItem('londonUncovered:v0')).collected &&
        Object.keys(JSON.parse(win.localStorage.getItem('londonUncovered:v0')).collected).length === 1);

  /* ── Achievement ──────────────────────────────────────────────────────── */
  group('achievements');
  await until(() => qa('#toasts .toast').length > 1, { timeout: 4000 });
  check('First Find achievement unlocked',
        !!JSON.parse(win.localStorage.getItem('londonUncovered:v0')).unlockedAchievements.first_find);

  /* ── Tabs ─────────────────────────────────────────────────────────────── */
  group('navigation');
  q('.tab[data-tab="quest"]').click();
  await until(() => !q('#screen-quest').hidden);
  check('quest screen shows', !q('#screen-quest').hidden);
  eq('five quests rendered', qa('#quest-body .quest').length, 5);
  check('a quest reports progress', /1 \/ 3|1 \/ 1/.test(q('#quest-body').textContent));
  check('map controls hidden behind the quest tab',
        win.getComputedStyle(q('#map-controls')).display === 'none');

  q('.tab[data-tab="mylondon"]').click();
  await until(() => !q('#screen-mylondon').hidden);
  check('my london screen shows', !q('#screen-mylondon').hidden);
  check('hero numbers rendered', qa('#mylondon-body .hero-num').length === 2, q('#mylondon-body .hero-num')?.textContent);
  check('level card rendered', /Explorer · Level/.test(q('#mylondon-body').textContent));
  check('recent discovery listed', qa('#mylondon-body .recent-item').length >= 1);

  q('#mylondon-body [data-seg="collections"]').click();
  await until(() => qa('#mylondon-body .collection').length > 0);
  check('nine category collections', qa('#mylondon-body [data-act="open-category"]').length === 9);
  check('themed collections listed', qa('#mylondon-body [data-act="open-theme"]').length >= 8,
        `${qa('#mylondon-body [data-act="open-theme"]').length} themes`);
  check('themes carry a tagline', /everyone knows|outlived them|swing/i.test(q('#mylondon-body').textContent));

  // Tapping a theme should take you to the map showing what is left in it.
  const themeCard = qa('#mylondon-body [data-act="open-theme"]')[0];
  const themeId = themeCard.dataset.theme;
  themeCard.click();
  await until(() => lu.state.filters.theme === themeId, { timeout: 4000 });
  eq('the theme filter activates', lu.state.filters.theme, themeId);
  check('it returns you to the map', !q('#screen-mylondon').hidden === false);
  check('the map count names the set', /·/.test(q('#map-count').textContent), q('#map-count').textContent);
  const themeTotal = lu.state.themes.find(t => t.id === themeId).total;
  check('only that set is shown', lu.state.plaques.filter(p =>
        lu.state.themes.find(t => t.id === themeId).ids.has(p.id)).length === themeTotal);
  check('the filter badge counts the theme', !q('#filter-badge').hidden);
  lu.state.filters.theme = null;
  q('.tab[data-tab="mylondon"]').click();
  await until(() => !q('#screen-mylondon').hidden);

  q('#mylondon-body [data-seg="achievements"]').click();
  await until(() => qa('#mylondon-body .ach').length > 0);
  check('achievement grid rendered', qa('#mylondon-body .ach').length >= 10, `${qa('#mylondon-body .ach').length} badges`);
  check('at least one achievement unlocked', qa('#mylondon-body .ach.unlocked').length >= 1);
  check('locked achievements show progress', qa('#mylondon-body .ach.locked .bar').length >= 1);

  q('.tab[data-tab="map"]').click();
  await until(() => q('#screen-quest').hidden && q('#screen-mylondon').hidden);
  check('returning to map restores the controls',
        win.getComputedStyle(q('#map-controls')).display !== 'none');

  /* ── Filters ──────────────────────────────────────────────────────────── */
  group('filters');
  q('#filters-open').click();
  await until(() => q('#sheet-filters').classList.contains('open'));
  check('filter sheet opens', q('#sheet-filters').classList.contains('open'));
  check('status, category, fame and distance groups', qa('#filters-body .fl-group').length === 4);
  check('distance disabled without location', qa('#filters-body [data-group="distance"]').every(b => b.disabled));
  const before = q('#map-count').textContent;
  q('#filters-body [data-group="fame"][data-value="iconic"]').click();
  await until(() => q('#map-count').textContent !== before);
  check('applying a filter changes the visible count', q('#map-count').textContent !== before, q('#map-count').textContent);
  check('apply button reports the count', /Show \d/.test(q('#filters-apply').textContent), q('#filters-apply').textContent);
  check('filter badge appears', !q('#filter-badge').hidden);
  q('#filters-clear').click();
  await until(() => q('#filter-badge').hidden);
  check('clearing filters resets the badge', q('#filter-badge').hidden);
  q('#filters-close').click();

  /* ── Category chip ────────────────────────────────────────────────────── */
  group('categories');
  const musicChip = qa('#chips .chip').find(c => c.dataset.cat === 'music');
  musicChip.focus();
  musicChip.click();
  await until(() => musicChip.getAttribute('aria-pressed') === 'true');
  check('chip activates', musicChip.getAttribute('aria-pressed') === 'true');
  check('chip element survives selection (focus is not lost)',
        doc.activeElement === musicChip, `focus is on ${doc.activeElement?.tagName}.${doc.activeElement?.className}`);
  const musicTotal = lu.state.byCategory.get('music').length;
  check('map count matches the category size',
        q('#map-count').textContent.includes(musicTotal.toLocaleString('en-GB')),
        `${q('#map-count').textContent} vs ${musicTotal}`);
  qa('#chips .chip')[0].click();
  await until(() => qa('#chips .chip')[0].getAttribute('aria-pressed') === 'true');
  check('All chip restores the full set', /935|\d{3} discoveries/.test(q('#map-count').textContent));

  /* ── About ────────────────────────────────────────────────────────────── */
  group('about & seo');
  const og = sel => doc.querySelector(sel)?.getAttribute('content') || '';
  check('share card declared for Open Graph', og('meta[property="og:image"]').endsWith('og-cover.png'));
  check('share card uses an absolute url', og('meta[property="og:image"]').startsWith('https://'));
  check('share card dimensions declared',
        og('meta[property="og:image:width"]') === '1200' && og('meta[property="og:image:height"]') === '630');
  check('share card has alt text', og('meta[property="og:image:alt"]').length > 20);
  check('twitter uses the large card', og('meta[name="twitter:card"]') === 'summary_large_image');

  check('crawlable About copy is in the DOM', doc.getElementById('about-content').textContent.length > 900);
  check('OpenPlaques attributed', /OpenPlaques/.test(doc.getElementById('about-content').textContent));
  check('not claiming to be English Heritage',
        /not affiliated/.test(doc.getElementById('about-content').textContent));
  q('#about-open').click();
  await until(() => q('#sheet-about').classList.contains('open'));
  check('about sheet opens', q('#sheet-about').classList.contains('open'));
  q('#about-close').click();

  /* ── Location invitation (PRD §19–21) ─────────────────────────────────── */
  group('location invite');
  check('no browser permission was requested on load', lu.state.locationStatus === 'idle' || !!lu.state.userPos);
  check('the invitation is remembered so it cannot nag',
        lu.state.saved.settings.locationInviteSeen === true ||
        lu.state.saved.settings.locationInviteSeen === undefined);

  /* ── Location (PRD §19–25, §31–33) ────────────────────────────────────── */
  // The test runner grants geolocation and pins the fix to a real plaque, so
  // the verified-collection path can be exercised end to end.
  const standingOnId = new URLSearchParams(location.hash.slice(1)).get('geo');
  if (standingOnId && win.navigator.geolocation) {
    group('location');
    check('location not requested before the user asks', lu.state.userPos === null);
    q('#locate').click();
    const gotFix = await until(() => lu.state.userPos, { timeout: 20000 });
    check('a fix is acquired after tapping the location button', !!gotFix);

    if (gotFix) {
      await until(() => qa('.userdot').length > 0, { timeout: 5000 });
      check('user position marker drawn', qa('.userdot').length > 0);

      // Near me (PRD §22)
      check('Near me control appears once located', !q('#nearby').hidden);
      q('#nearby').click();
      await until(() => q('#sheet-nearby').classList.contains('open'));
      check('Near me sheet opens', q('#sheet-nearby').classList.contains('open'));
      const nearbyRows = qa('#nearby-body .mp-item');
      check('nearby discoveries listed', nearbyRows.length > 0, `${nearbyRows.length} rows`);
      check('distances shown on nearby rows', qa('#nearby-body .mp-dist').length === nearbyRows.length);
      const dists = qa('#nearby-body .mp-dist').map(e => e.textContent);
      check('nearby list is ordered by distance', (() => {
        const m = dists.map(t => t.endsWith('km') ? parseFloat(t) * 1000 : parseFloat(t));
        return m.every((v, i) => i === 0 || v >= m[i - 1] - 0.5);
      })(), dists.slice(0, 4).join(' · '));
      check('nearby list prioritises uncollected',
            qa('#nearby-body .mp-item.done').length === 0);
      q('#nearby-close').click();
      await until(() => !q('#sheet-nearby').classList.contains('open'));

      // Distance filters unlock once a position exists.
      q('#filters-open').click();
      await until(() => q('#sheet-filters').classList.contains('open'));
      check('distance filters enabled with a location',
            qa('#filters-body [data-group="distance"]').every(b => !b.disabled));
      q('#filters-close').click();

      // Standing on a plaque: the sheet must offer a verified collect.
      lu.open(standingOnId);
      await until(() => q('#sheet-plaque').classList.contains('open'));
      check('sheet shows how far away the plaque is', /\d+\s?m|km/.test(q('#plaque-body').textContent));
      const verifiedBtn = q('#plaque-foot [data-act="collect"][data-verified="1"]');
      check('nearby plaque offers a verified collect', !!verifiedBtn,
            q('#plaque-foot').textContent.trim().slice(0, 70));
      check('verification is explained', /verified/i.test(q('#plaque-foot').textContent));

      if (verifiedBtn) {
        verifiedBtn.click();
        await until(() => lu.progress().verified === 1);
        eq('collecting on location is verified', lu.progress().verified, 1);
        check('verified find earns the location bonus', lu.progress().xp >= 20);
        check('Local Explorer quest completes',
              !!JSON.parse(win.localStorage.getItem('londonUncovered:v0')).completedQuests.local_explorer);
      }

      // Find my next discovery — first tap shows the one-time explainer.
      q('.tab[data-tab="map"]').click();
      q('#find-next').click();
      await until(() => q('#sheet-message').classList.contains('open'), { timeout: 5000 });
      check('first Find-next tap shows the one-time explainer',
            /Uncover London as you explore/.test(q('#message-body').textContent));
      q('#message-body [data-msg="primary"]').click();

      const targeted = await until(() => lu.state.targetId, { timeout: 12000 });
      check('a next discovery is chosen', !!targeted);
      check('the target is not already collected', targeted && !lu.state.saved.collected[targeted]);
      await until(() => qa('.pin-target').length > 0, { timeout: 5000 });
      check('target marker is highlighted', qa('.pin-target').length > 0);
      check('target sheet is labelled as the next discovery',
            /Your next discovery/i.test(q('#plaque-body').textContent));
      check('walking time offered', /min/.test(q('#plaque-foot').textContent + q('#plaque-body').textContent));
      const dirHref = q('#plaque-foot a[data-act="directions"]')?.href || '';
      check('directions open Google Maps', dirHref.startsWith('https://www.google.com/maps/dir/'), dirHref.slice(0, 60));
      check('directions ask for walking', dirHref.includes('travelmode=walking'));
      check('directions carry the plaque coordinates', /destination=5[01]/.test(decodeURIComponent(dirHref)));

      const firstTarget = lu.state.targetId;
      const another = q('#plaque-foot [data-act="choose-another"]');
      check('choose another is offered', !!another);
      if (another) {
        another.click();
        await until(() => lu.state.targetId && lu.state.targetId !== firstTarget, { timeout: 12000 });
        check('choose another picks a different discovery', lu.state.targetId !== firstTarget);
      }

      check('no coordinates recorded in analytics',
            !JSON.stringify(lu.events()).includes(String(lu.state.userPos.lat).slice(0, 7)));
      check('no coordinates written to storage',
            !String(win.localStorage.getItem('londonUncovered:v0')).includes(String(lu.state.userPos.lat).slice(0, 7)));
    }
  }

  /* ── Verify-anywhere test override (js/config.js) ─────────────────────── */
  group('verify override');
  check('override is off unless asked for', lu.state.verifyAnywhere === false);

  // A plaque comfortably outside the 100 m radius, wherever the fix is.
  const anchor = lu.state.userPos || { lat: 51.5074, lng: -0.1278 };
  const faraway = lu.state.plaques.find(p =>
    !lu.state.saved.collected[p.id] && Math.abs(p.lat - anchor.lat) > 0.02);

  if (faraway) {
    lu.open(faraway.id);
    await until(() => q('#sheet-plaque').classList.contains('open'));
    check('a distant plaque offers no verified collect by default',
          !q('#plaque-foot [data-act="collect"][data-verified="1"]'));

    lu.verifyAnywhere(true);
    await until(() => !!q('#plaque-foot [data-act="collect"][data-verified="1"]'), { timeout: 4000 });
    check('override offers a verified collect on a distant plaque',
          !!q('#plaque-foot [data-act="collect"][data-verified="1"]'));
    check('override is labelled as test mode in the sheet',
          /Test mode/.test(q('#plaque-foot').textContent), q('#plaque-foot').textContent.trim().slice(0, 80));

    const verifiedBefore = lu.progress().verified;
    q('#plaque-foot [data-act="collect"][data-verified="1"]').click();
    await until(() => lu.progress().verified === verifiedBefore + 1, { timeout: 4000 });
    eq('collecting under the override is recorded as verified',
       lu.progress().verified, verifiedBefore + 1);
    check('the verified bonus is awarded',
          lu.state.saved.collected[faraway.id]?.verified === true);

    lu.verifyAnywhere(false);
    const another = lu.state.plaques.find(p =>
      !lu.state.saved.collected[p.id] && Math.abs(p.lat - anchor.lat) > 0.02);
    lu.open(another.id);
    await until(() => q('#plaque-body').textContent.includes(another.title), { timeout: 4000 });
    check('switching the override off restores the proximity check',
          !q('#plaque-foot [data-act="collect"][data-verified="1"]'));
    q('#plaque-close').click();
  }

  /* ── Responsive sweep (PRD §57) ───────────────────────────────────────── */
  group('responsive');
  const widths = [320, 375, 390, 430, 768, 1024, 1440];
  for (const w of widths) {
    frame.style.width = `${w}px`;
    frame.width = w;
    await sleep(260);
    const overflow = doc.documentElement.scrollWidth - w;
    check(`no horizontal overflow at ${w}px`, overflow <= 1, `overflows by ${overflow}px`);
    const bar = q('#brandbar').getBoundingClientRect();
    check(`brand bar fits at ${w}px`, bar.right <= w + 1 && bar.left >= -1,
          `${bar.left.toFixed(0)}–${bar.right.toFixed(0)}`);
    if (w >= 900) {
      check(`panel layout engages at ${w}px`,
            win.getComputedStyle(q('#map-panel')).display === 'block');
    } else {
      check(`tab bar is pinned to the bottom at ${w}px`,
            Math.abs(q('#tabbar').getBoundingClientRect().bottom - frame.clientHeight) < 2);
    }
  }
  frame.style.width = '390px'; frame.width = 390;
  await sleep(260);

  /* ── Accessibility (PRD §58) ──────────────────────────────────────────── */
  group('accessibility');
  check('page language declared', doc.documentElement.lang.startsWith('en'));
  // Controls inside a hidden subtree are not exposed to assistive tech either.
  const exposedButtons = qa('button').filter(b => !b.closest('[hidden]'));
  const unlabelled = exposedButtons.filter(b => !b.textContent.trim() && !b.getAttribute('aria-label'));
  check('every icon-only control is labelled', unlabelled.length === 0,
        unlabelled.map(b => b.id || b.className).join(', '));
  check('images carry alt text', qa('img').every(i => i.hasAttribute('alt')));
  check('search input is labelled',
        !!doc.querySelector('label[for="search"]') || !!q('#search').getAttribute('aria-label'));
  check('tabs expose the current page', qa('.tab').some(t => t.getAttribute('aria-current') === 'page'));
  check('live region present for announcements', !!q('#live') && q('#live').getAttribute('aria-live') === 'polite');
  // A `hidden` attribute must actually hide: author display rules outrank the
  // UA stylesheet unless a reset says otherwise.
  const wronglyVisible = qa('[hidden]').filter(el => win.getComputedStyle(el).display !== 'none');
  check('every [hidden] element is really hidden', wronglyVisible.length === 0,
        wronglyVisible.map(el => el.id || el.className).join(', '));
  check('closed sheets are inert to keyboard users',
        qa('.sheet').filter(sh => !sh.classList.contains('open'))
                    .every(sh => sh.hasAttribute('inert') || sh.getAttribute('aria-hidden') === 'true'));
  check('reduced motion is honoured in CSS',
        Array.from(doc.styleSheets).some(sheet => {
          try { return Array.from(sheet.cssRules).some(r => String(r.conditionText || '').includes('prefers-reduced-motion')); }
          catch { return false; }
        }));
  // Contrast is measured on rendered text against its effective background,
  // so a token change or a new component cannot quietly ship below WCAG AA.
  const srgb = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
  const parseRGB = str => (str.match(/[\d.]+/g) || []).map(Number);
  const luminance = ([r, g, b]) => 0.2126 * srgb(r) + 0.7152 * srgb(g) + 0.0722 * srgb(b);
  const contrast = (fg, bg) => {
    const [a, b] = [luminance(fg), luminance(bg)].sort((x, y) => y - x);
    return (a + 0.05) / (b + 0.05);
  };
  const effectiveBg = (el) => {
    for (let node = el; node && node !== doc.documentElement; node = node.parentElement) {
      const c = parseRGB(win.getComputedStyle(node).backgroundColor);
      if (c.length >= 3 && (c[3] === undefined || c[3] > 0.85)) return c.slice(0, 3);
    }
    return [247, 245, 240];   // the ivory ground
  };

  const textNodes = qa('#screen-mylondon *, #sheet-plaque *, #screen-quest *, #map-controls *')
    .filter(el => el.offsetParent !== null
                && [...el.childNodes].some(n => n.nodeType === 3 && n.textContent.trim().length > 1));
  const lowContrast = [];
  for (const el of textNodes.slice(0, 250)) {
    const cs = win.getComputedStyle(el);
    const fg = parseRGB(cs.color).slice(0, 3);
    if (fg.length < 3) continue;
    const size = parseFloat(cs.fontSize);
    const bold = Number(cs.fontWeight) >= 700;
    const isLarge = size >= 24 || (size >= 18.66 && bold);
    const need = isLarge ? 3 : 4.5;
    const got = contrast(fg, effectiveBg(el));
    if (got < need - 0.01) {
      lowContrast.push(`${el.className || el.tagName}@${size}px ${got.toFixed(2)}:1 (need ${need})`);
    }
  }
  check('all visible text meets WCAG AA contrast', lowContrast.length === 0,
        [...new Set(lowContrast)].slice(0, 6).join(' · '));

  const chip0 = qa('#chips .chip')[0];
  chip0.focus();
  check('chips are keyboard focusable', doc.activeElement === chip0);
  check('chips expose pressed state', chip0.hasAttribute('aria-pressed'));

  /* ── Share card ───────────────────────────────────────────────────────── */
  group('share card');
  lu.reset();
  q('.tab[data-tab="mylondon"]').click();
  await until(() => !q('#screen-mylondon').hidden);
  q('#mylondon-body [data-seg="overview"]').click();
  await until(() => !!q('#mylondon-body [data-act="go-map"]') || !!q('#mylondon-body [data-act="share"]'));
  check('an empty collection has nothing to post', !q('#mylondon-body [data-act="share"]'));

  lu.state.plaques.filter(p => p.category === 'writers').slice(0, 6).forEach(p => lu.collect(p.id));
  await until(() => lu.progress().count === 6);
  q('#mylondon-body [data-seg="overview"]').click();
  await until(() => !!q('#mylondon-body [data-act="share"]'));
  q('#mylondon-body [data-act="share"]').click();
  await until(() => q('#sheet-share').classList.contains('open'), { timeout: 8000 });
  check('the share sheet opens', q('#sheet-share').classList.contains('open'));

  const preview = q('.share-preview');
  check('a card image is rendered', !!preview && preview.src.startsWith('data:image/png'));
  check('the image is Instagram portrait ratio', !!preview);
  check('the card image is substantial', (preview?.src.length || 0) > 20000,
        `${Math.round((preview?.src.length || 0) / 1024)} KB data url`);
  check('the alt text describes the numbers', /6 discoveries found/.test(preview?.alt || ''), preview?.alt?.slice(0, 70));
  check('an epithet is derived from what they collect',
        /Literary Londoner/i.test(q('#share-body').textContent), q('#share-body').textContent.slice(0, 80));
  check('sharing the image is offered', !!q('[data-share="image"]'));
  check('saving the image is offered', !!q('[data-share="save"]'));
  check('a plain link is still offered', !!q('[data-share="link"]'));
  q('#share-close').click();
  await until(() => !q('#sheet-share').classList.contains('open'));
  lu.reset();

  /* ── Iconic collect celebration ───────────────────────────────────────── */
  group('iconic perk');
  lu.reset();
  const ordinary = lu.state.plaques.find(p => p.fame < 3);
  lu.collect(ordinary.id, false);
  await until(() => lu.progress().count === 1);
  check('an ordinary discovery gets a toast, not a card', q('#celebrate').hidden);

  const iconicPlaque = lu.state.plaques.find(p => p.fame >= 3);
  lu.collect(iconicPlaque.id, false);
  await until(() => !q('#celebrate').hidden, { timeout: 4000 });
  check('an Iconic discovery earns a card', !q('#celebrate').hidden);
  const cel = q('#celebrate').textContent;
  check('the card names the person', cel.includes(iconicPlaque.title), cel.slice(0, 50));
  check('the plaque is drawn as a plaque', !!q('.cel-plaque-name'));
  check('it carries a line about them', (q('.cel-note')?.textContent || '').length > 20,
        q('.cel-note')?.textContent);
  check('the XP lands with it', /\+50 XP/.test(cel));
  check('the card is reachable by keyboard', !!q('.cel-done'));
  q('.cel-done').click();
  await until(() => q('#celebrate').hidden, { timeout: 3000 });
  check('dismissing returns you to the map', q('#celebrate').hidden);

  // The note should stay with the plaque, not vanish with the card.
  lu.open(iconicPlaque.id);
  await until(() => q('#sheet-plaque').classList.contains('open'));
  q('.pq-peek')?.click();
  await until(() => !!q('.pq-iconic-note'), { timeout: 3000 });
  check('the note is kept in the plaque sheet', !!q('.pq-iconic-note'));
  check('only Iconic plaques get one',
        lu.state.plaques.filter(p => p.fame < 3).length > 0 && !!q('.pq-iconic-note'));
  q('#plaque-close').click();
  lu.reset();

  /* ── Add to Home Screen (PRD §69) ─────────────────────────────────────── */
  group('home screen');
  lu.reset();
  q('.tab[data-tab="mylondon"]').click();
  await until(() => !q('#screen-mylondon').hidden);
  q('#mylondon-body [data-seg="overview"]').click();
  await until(() => !!q('#mylondon-body [data-act="install"]') || !!q('#mylondon-body [data-act="go-map"]'));
  check('an empty collection offers no Home Screen nag', !q('#mylondon-body [data-act="install"]'));

  lu.state.plaques.slice(0, 3).forEach(p => lu.collect(p.id));
  await until(() => lu.progress().count === 3);
  q('#mylondon-body [data-seg="overview"]').click();
  await until(() => !!q('#mylondon-body [data-act="install"]'));
  check('My London offers it on demand', !!q('#mylondon-body [data-act="install"]'));

  q('#mylondon-body [data-act="install"]').click();
  await until(() => q('#sheet-install').classList.contains('open'));
  check('the Home Screen sheet opens', q('#sheet-install').classList.contains('open'));
  const installText = q('#install-body').textContent;
  check('it says what is being protected', /3 discoveries/.test(installText), installText.slice(0, 60));
  check('it explains why, not just how', /saved in this browser/i.test(installText));
  check('it offers a way out', !!q('#sheet-install [data-install="later"]'));
  check('desktop gets written steps rather than a fake button',
        !!q('.install-step') || !!q('[data-install="go"]'));
  q('#sheet-install [data-install="later"]').click();
  await until(() => !q('#sheet-install').classList.contains('open'));
  check('dismissing closes it', !q('#sheet-install').classList.contains('open'));
  check('being offered is remembered', lu.state.saved.settings.homeScreenPromptSeen === true);
  lu.reset();
  q('.tab[data-tab="map"]').click();

  /* ── Analytics taxonomy (docs/analytics-plan.md) ──────────────────────── */
  group('analytics');
  const paths = lu.events().map(e => e.path);
  check('a visit event records new vs returning',
        paths.some(p => p === 'visit/new' || p === 'visit/returning'), paths[0]);
  check('collections map to verified / seen paths',
        paths.some(p => p === 'collect/verified' || p === 'collect/seen'));
  check('the activation milestone is announced', paths.includes('milestone/1'));
  check('category browsing is recorded', paths.some(p => p.startsWith('category/')));
  check('location outcomes are recorded', paths.some(p => p.startsWith('location/')));
  check('find-next is recorded', paths.some(p => p.startsWith('find-next')));
  check('every path is url-safe and lowercase',
        paths.every(p => /^[a-z0-9/_-]+$/.test(p)),
        paths.filter(p => !/^[a-z0-9/_-]+$/.test(p)).join(', '));
  const payload = JSON.stringify(lu.events());
  check('no coordinates in any event', !/\b51\.\d{3}/.test(payload));
  check('no plaque ids in any event path', !paths.some(p => /\/\d{3,}$/.test(p)));

  /* ── Reset ────────────────────────────────────────────────────────────── */
  group('reset');
  lu.reset();
  await until(() => lu.progress().count === 0);
  eq('progress cleared', lu.progress().count, 0);
  await until(() => qa('.pin-collected').length === 0, { timeout: 3000 });
  eq('collected markers reverted', qa('.pin-collected').length, 0);
}

  /* ── Backup and restore (js/backup.js) ────────────────────────────────── */
  group('backup & restore');
  lu.reset();
  const backupIds = lu.state.plaques.slice(0, 3).map(p => p.id);
  backupIds.forEach(id => lu.collect(id));
  await until(() => lu.progress().count === 3);

  const url = lu.backupUrl();
  check('a backup link is produced', !!url, url.slice(0, 60));
  check('the payload rides in the fragment, never the query',
        url.includes('#restore=lu1-') && !url.includes('?restore'));
  check('the link is short enough to share', url.length < 400, `${url.length} chars`);

  q('.tab[data-tab="mylondon"]').click();
  await until(() => !q('#screen-mylondon').hidden);
  // The segment is sticky, and an earlier group left it on Achievements.
  q('#mylondon-body [data-seg="overview"]').click();
  await until(() => !!q('#mylondon-body [data-act="backup"]'));
  check('the Overview offers a backup link', !!q('#mylondon-body [data-act="backup"]'));
  q('#mylondon-body [data-act="backup"]').click();
  await until(() => q('#sheet-backup').classList.contains('open'));
  check('the backup sheet opens from My London', q('#sheet-backup').classList.contains('open'));
  check('the sheet shows the link', (q('#backup-url')?.value || '').includes('#restore=lu1-'));
  check('the sheet warns to keep it private', /Keep it to yourself/.test(q('#backup-body').textContent));

  // Closing without taking the link must warn rather than silently discard it.
  q('#backup-close').click();
  await until(() => !!q('#backup-warn'), { timeout: 3000 });
  check('closing without copying warns first', !!q('#backup-warn'));
  check('the sheet stays open on that first attempt', q('#sheet-backup').classList.contains('open'));
  check('the warning explains the consequence',
        /cannot pick this collection up/.test(q('#backup-warn').textContent));
  check('the warning offers to copy', !!q('#backup-warn [data-backup="copy"]'));
  q('#backup-warn [data-backup="dismiss"]').click();
  await until(() => !q('#sheet-backup').classList.contains('open'), { timeout: 3000 });
  check('close anyway lets you out', !q('#sheet-backup').classList.contains('open'));

  // Now simulate a different browser. Tear the old page down *before* wiping
  // storage — a live app can write its state back at any moment (a setting
  // change persists the whole save), which would undo the wipe.
  const token = url.split('#')[1];
  frame.src = 'about:blank';
  await until(() => !frame.contentWindow?.__lu, { timeout: 8000 });
  try { localStorage.removeItem('londonUncovered:v0'); } catch { /* ignore */ }
  // A query parameter forces a real navigation: changing only the fragment is a
  // same-document move, so the app would never re-boot and read the token.
  frame.src = `/index.html?fresh=${Date.now()}#${token}`;

  // The new document is identifiable: storage was cleared, so it boots at zero
  // and puts the restore prompt up.
  const restored = await until(() =>
    frame.contentWindow?.__lu?.progress?.().count === 0 &&
    frame.contentDocument?.querySelector('#sheet-message')?.classList.contains('open'),
    { timeout: 40000 });
  check('opening the link in a clean browser offers a restore', !!restored);

  if (restored) {
    const doc2 = frame.contentDocument;
    const win2 = frame.contentWindow;
    const lu2 = win2.__lu;
    check('the prompt says how much it carries', /3/.test(doc2.querySelector('#message-body').textContent));
    check('the restore button speaks in the first person',
          /Restore my 3 discoveries/.test(doc2.querySelector('#message-body').textContent),
          doc2.querySelector('#message-body [data-msg="primary"]')?.textContent);
    check('it promises to merge, not replace',
          /nothing is replaced/i.test(doc2.querySelector('#message-body').textContent));
    doc2.querySelector('#message-body [data-msg="primary"]').click();
    await until(() => lu2.progress().count === 3, { timeout: 8000 });
    eq('the collection continues in the new browser', lu2.progress().count, 3);
    check('the same discoveries came across',
          backupIds.every(id => !!lu2.state.saved.collected[id]));
    check('achievements were recomputed, not carried',
          !!JSON.parse(win2.localStorage.getItem('londonUncovered:v0')).unlockedAchievements.first_find);
    check('the token is cleared from the address bar',
          !win2.location.hash.includes('restore'), win2.location.hash);
    check('the restore was recorded for analytics',
          lu2.events().some(e => e.path === 'backup/restored'));
    lu2.reset();
  }

/* ── Deep link from a static plaque page (?plaque=<id>) ──────────────────── */
group('deep link');
{
  // A whole reload, because the app reads the parameter once during boot.
  const target = frame.contentWindow.__lu.state.plaques[0];
  frame.src = 'about:blank';
  await until(() => !frame.contentWindow?.__lu, { timeout: 8000 });
  frame.src = `/index.html?plaque=${encodeURIComponent(target.id)}`;
  const linked = await until(() => frame.contentWindow?.__lu &&
                                   frame.contentDocument?.getElementById('boot')?.hidden,
                             { timeout: 40000 });
  check('the app boots with ?plaque= in the URL', !!linked);

  if (linked) {
    const doc3 = frame.contentDocument;
    const win3 = frame.contentWindow;
    await until(() => doc3.querySelector('#sheet-plaque').classList.contains('open'), { timeout: 8000 });
    check('the plaque sheet opened on load',
          doc3.querySelector('#sheet-plaque').classList.contains('open'));
    eq('it opened the plaque named in the URL', win3.__lu.state.openPlaqueId, target.id);
    check('the sheet shows that plaque',
          doc3.querySelector('#plaque-body').textContent.includes(target.title));
    eq('the app is on the map tab', doc3.body.dataset.tab, 'map');
  }

  // An id that is not in the dataset must leave a perfectly ordinary app.
  frame.src = 'about:blank';
  await until(() => !frame.contentWindow?.__lu, { timeout: 8000 });
  frame.src = '/index.html?plaque=not-a-real-id';
  const graceful = await until(() => frame.contentWindow?.__lu &&
                                     frame.contentDocument?.getElementById('boot')?.hidden,
                               { timeout: 40000 });
  check('an unknown plaque id still boots the app', !!graceful);
  if (graceful) {
    const doc4 = frame.contentDocument;
    check('no plaque sheet is forced open',
          !doc4.querySelector('#sheet-plaque').classList.contains('open'));
    check('the map still rendered markers',
          doc4.querySelectorAll('.leaflet-marker-icon').length > 10);
    check('no error card rendered', !doc4.body.textContent.includes("Couldn't load"));
  }
}

} catch (err) {
  failed++;
  lines.push(`<span class="fail">  THREW</span> ${err && err.stack ? err.stack : err}`);
}

/* ── Report ─────────────────────────────────────────────────────────────── */
flush();
const summary = failed === 0
  ? `<span class="pass">SMOKE PASS — ${passed} checks</span>`
  : `<span class="fail">SMOKE FAIL — ${failed} of ${passed + failed} checks failed</span>`;
document.getElementById('summary').innerHTML = summary;
document.title = failed === 0 ? `SMOKE_PASS ${passed}` : `SMOKE_FAIL ${failed}/${passed + failed}`;
</script>
</body>
</html>
